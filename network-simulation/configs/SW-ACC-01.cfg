! ==============================================================================
! CISCO IOS RUNNING-CONFIG: SW-ACC-01 (Catalyst 2960-X - Layer 2)
! SERNMS Access Layer Switch: End-User Ports, 802.1Q Trunk, Port Security
! ==============================================================================
version 15.0
hostname SW-ACC-01
!
vlan 10
 name HR-Network
vlan 20
 name IT-Ops-Network
vlan 40
 name Admin-Mgmt
vlan 99
 name Native-BlackHole
!
! Management Interface for Out-of-Band SERNMS Monitoring
interface Vlan40
 description Switch Management IP
 ip address 10.10.40.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.40.1
!
! Trunk to Core Switch
interface GigabitEthernet0/1
 description Trunk Uplink to SW-CORE-01
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,40
 no shutdown
!
! Access Ports for HR Workstations (VLAN 10)
interface range FastEthernet0/1 - 12
 description HR Department PC Endpoints
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
! Access Ports for IT Support Workstations (VLAN 20)
interface range FastEthernet0/13 - 24
 description IT Support Engineers PC Endpoints
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
snmp-server community public RO
snmp-server location BuildingA-IDF1
!
end
