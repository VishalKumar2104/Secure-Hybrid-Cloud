! ==============================================================================
! CISCO ASA CONFIGURATION: ASA-FW-01 (Cisco ASA 5506-X)
! SERNMS Enterprise Perimeter NextGen Firewall & State Inspection
! ==============================================================================
hostname FW-CORE-01
!
interface GigabitEthernet1/1
 nameif outside
 security-level 0
 ip address 10.10.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/2
 nameif inside
 security-level 100
 ip address 10.10.0.3 255.255.255.252
 no shutdown
!
! Management Interface for SERNMS Telemetry
interface Management1/1
 nameif management
 security-level 50
 ip address 10.10.40.2 255.255.255.0
 management-only
 no shutdown
!
! Access List Permitting Internal Campus Workstations to reach AWS VPC & Internet
access-list INSIDE_OUT extended permit ip 10.10.0.0 255.255.0.0 10.0.0.0 255.255.0.0
access-list INSIDE_OUT extended permit ip 10.10.0.0 255.255.0.0 any
access-group INSIDE_OUT in interface inside
!
! Access List Filtering External Traffic
access-list OUTSIDE_IN extended permit icmp any any echo-reply
access-list OUTSIDE_IN extended permit icmp any any unreachable
access-group OUTSIDE_IN in interface outside
!
! Static Routes
route outside 0.0.0.0 0.0.0.0 10.10.0.1 1
route outside 10.0.0.0 255.255.0.0 10.10.0.1 1
route inside 10.10.0.0 255.255.0.0 10.10.0.4 1
!
! State Inspection
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect dns
  inspect http
  inspect tls
service-policy global_policy global
!
snmp-server community public
snmp-server location HeadOffice-MDF-Perimeter
!
end
