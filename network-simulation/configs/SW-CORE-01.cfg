! ==============================================================================
! CISCO IOS RUNNING-CONFIG: SW-CORE-01 (Catalyst 3650-24TS - Layer 3)
! SERNMS Distribution / Core Switch: Inter-VLAN Routing & SVIs
! ==============================================================================
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SW-CORE-01
!
ip routing
!
! ==========================================
! CAMPUS VLAN DEFINITIONS (802.1Q)
! ==========================================
vlan 10
 name HR-Network
!
vlan 20
 name IT-Ops-Network
!
vlan 30
 name Finance-Network
!
vlan 40
 name Admin-Mgmt
!
vlan 99
 name Native-BlackHole
!
! ==========================================
! SWITCH VIRTUAL INTERFACES (DEFAULT GATEWAYS)
! ==========================================
interface Vlan10
 description HR Subnet Default Gateway
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description IT Operations Default Gateway
 ip address 10.10.20.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description Finance Default Gateway
 ip address 10.10.30.1 255.255.255.0
 no shutdown
!
interface Vlan40
 description Admin Management Gateway
 ip address 10.10.40.1 255.255.255.0
 no shutdown
!
! ==========================================
! PHYSICAL TRUNKS & UPLINKS
! ==========================================
! Uplink to Perimeter Firewall
interface GigabitEthernet1/0/24
 description Uplink to ASA Firewall Inside Interface
 no switchport
 ip address 10.10.0.3 255.255.255.252
 no shutdown
!
! 802.1Q Trunk Link to Access Switch SW-ACC-01 (Building A IDF 1)
interface GigabitEthernet1/0/1
 description Trunk to SW-ACC-01 (HR & IT)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,40
 no shutdown
!
! 802.1Q Trunk Link to Access Switch SW-ACC-02 (Building A IDF 2)
interface GigabitEthernet1/0/2
 description Trunk to SW-ACC-02 (Finance)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,40
 no shutdown
!
! 802.1Q Trunk Link to Access Switch SW-ACC-03 (Building B IDF 1)
interface GigabitEthernet1/0/3
 description Trunk to SW-ACC-03 (Admin & Server Room)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 40
 no shutdown
!
! ==========================================
! INTER-VLAN SECURITY ACCESS CONTROL LISTS
! ==========================================
! Isolate HR and Finance from directly accessing Admin Management Subnet (VLAN 40)
ip access-list extended RESTRICT-ADMIN-ACCESS
 permit tcp 10.10.20.0 0.0.0.255 10.10.40.0 0.0.0.255 eq 22
 permit tcp 10.10.20.0 0.0.0.255 10.10.40.0 0.0.0.255 eq 443
 deny ip 10.10.10.0 0.0.0.255 10.10.40.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.40.0 0.0.0.255
 permit ip any any
!
interface Vlan40
 ip access-group RESTRICT-ADMIN-ACCESS in
!
! Default Route towards Perimeter Firewall
ip route 0.0.0.0 0.0.0.0 10.10.0.2
!
! SNMP Monitoring Community
snmp-server community public RO
snmp-server location HeadOffice-MDF-Rack02
!
end
