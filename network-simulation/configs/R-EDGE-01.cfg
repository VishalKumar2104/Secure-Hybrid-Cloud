! ==============================================================================
! CISCO IOS RUNNING-CONFIG: R-EDGE-01 (Cisco 2911 / ISR 4331)
! SERNMS Enterprise Campus Edge Router & IPSec VPN Gateway to AWS VPC
! ==============================================================================
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-EDGE-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
no aaa new-model
!
ip domain name enterprise.local
ip name-server 10.10.40.10
ip name-server 8.8.8.8
!
! ==========================================
! IKEv2 / IPSec Site-to-Site VPN to AWS VGW
! ==========================================
crypto ikev2 proposal AWS-IKEV2-PROPOSAL
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy AWS-IKEV2-POLICY
 proposal AWS-IKEV2-PROPOSAL
!
crypto ikev2 keyring AWS-KEYRING
 peer AWS-VGW
  address 54.210.88.192
  pre-shared-key EnterpriseAwsVpnKey2026!
!
crypto ikev2 profile AWS-IKEV2-PROFILE
 match identity remote address 54.210.88.192 255.255.255.255
 identity local address 203.0.113.1
 authentication remote pre-share
 authentication local pre-share
 keyring local AWS-KEYRING
 lifetime 28800
!
crypto ipsec transform-set AWS-TRANSFORM-SET esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile AWS-IPSEC-PROFILE
 set transform-set AWS-TRANSFORM-SET
 set ikev2-profile AWS-IKEV2-PROFILE
 set security-association lifetime seconds 3600
!
! ==========================================
! INTERFACES CONFIGURATION
! ==========================================
!
! Tunnel Interface to AWS Virtual Private Gateway
interface Tunnel0
 description Encrypted IPSec Tunnel to AWS VPC (10.0.0.0/16)
 ip address 169.254.10.2 255.255.255.252
 ip tcp adjust-mss 1379
 tunnel source GigabitEthernet0/0
 tunnel destination 54.210.88.192
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile AWS-IPSEC-PROFILE
!
! WAN Interface (Connected to ISP / Internet)
interface GigabitEthernet0/0
 description WAN Public Interface
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 duplex auto
 speed auto
 no shutdown
!
! LAN Interface (Connected to Enterprise Firewall Outside)
interface GigabitEthernet0/1
 description Trunk Link to ASA Perimeter Firewall
 ip address 10.10.0.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
 speed auto
 no shutdown
!
! Loopback Management Interface
interface Loopback0
 description Management Loopback
 ip address 10.10.0.254 255.255.255.255
!
! ==========================================
! NAT / PAT CONFIGURATION
! ==========================================
! Exclude Hybrid Cloud VPN Traffic from NAT Overload
ip access-list extended NO-NAT-ACL
 deny ip 10.10.0.0 0.0.255.255 10.0.0.0 0.0.255.255
 permit ip 10.10.0.0 0.0.255.255 any
!
ip nat inside source list NO-NAT-ACL interface GigabitEthernet0/0 overload
!
! ==========================================
! ROUTING PROTOCOLS & STATIC ROUTES
! ==========================================
! Static Route for Internet Default Gateway
ip route 0.0.0.0 0.0.0.0 203.0.113.2
!
! Static Route towards AWS VPC Subnets via IPSec Tunnel
ip route 10.0.0.0 255.255.0.0 Tunnel0
!
! Return Route for Enterprise Campus Subnets via Firewall
ip route 10.10.10.0 255.255.255.0 10.10.0.2
ip route 10.10.20.0 255.255.255.0 10.10.0.2
ip route 10.10.30.0 255.255.255.0 10.10.0.2
ip route 10.10.40.0 255.255.255.0 10.10.0.2
!
! SNMP Agent Configuration for Monitoring Telemetry
snmp-server community public RO
snmp-server location HeadOffice-MDF-Rack01
snmp-server contact netadmin@sernms.enterprise.local
!
line con 0
 password cisco
 login
 transport input none
line vty 0 4
 password cisco
 login
 transport input ssh
!
end
